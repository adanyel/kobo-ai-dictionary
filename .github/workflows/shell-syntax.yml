name: Shell syntax check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          sh -n src/ai-dictionary.sh
          sh -n src/ai-search.sh
          sh -n src/check-install.sh
          sh -n diagnostics/book-switch.sh

      - name: Test book context selection
        run: python3 -m unittest discover -s tests -v
